<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Mihon Enhanced</title>
  <desc id="desc">Your reading space, with a little extra. Organize, read, and share.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101c30"/><stop offset="1" stop-color="#172b3a"/></linearGradient>
    <linearGradient id="accent" x2="1" y2="1"><stop stop-color="#62e7cf"/><stop offset="1" stop-color="#80a7ff"/></linearGradient>
  </defs>
  <rect width="1280" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="1200" cy="28" r="252" fill="#76a3ff" opacity=".05"/>
  <circle cx="1180" cy="42" r="180" fill="none" stroke="#79a8c7" opacity=".12"/>
  <circle cx="1180" cy="42" r="244" fill="none" stroke="#79a8c7" opacity=".08"/>
  <rect x="0" y="34" width="6" height="292" rx="3" fill="url(#accent)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="64" y="70" font-size="15" font-weight="700" letter-spacing="4" fill="#79decf">A PERSONAL TAKE ON MIHON</text>
    <text x="60" y="150" font-size="66" font-weight="750" letter-spacing="-2" fill="#f5f8ff">Mihon <tspan fill="#82e4d4">Enhanced</tspan></text>
    <text x="64" y="195" font-size="23" fill="#b6c6db">Your reading space, with a little extra.</text>
    <g font-size="15" font-weight="600">
      <rect x="64" y="236" width="128" height="38" rx="19" fill="#203d42"/>
      <circle cx="85" cy="255" r="4" fill="#79e2cf"/>
      <text x="99" y="261" fill="#b9f4e7">ORGANIZE</text>
      <rect x="204" y="236" width="95" height="38" rx="19" fill="#253851"/>
      <circle cx="225" cy="255" r="4" fill="#93b9ff"/>
      <text x="239" y="261" fill="#c8daff">READ</text>
      <rect x="311" y="236" width="106" height="38" rx="19" fill="#403746"/>
      <circle cx="332" cy="255" r="4" fill="#f8be86"/>
      <text x="346" y="261" fill="#ffdcba">SHARE</text>
    </g>
    <text x="64" y="318" font-size="14" fill="#829bb8">OPEN SOURCE  /  BUILT WITH FRIENDS, FOR READERS</text>
